name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend
        run: |
          curl -fsS --max-time 120 "$RENDER_URL"
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}